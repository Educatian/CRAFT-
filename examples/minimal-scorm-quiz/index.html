<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal SCORM Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d8deea;
      --ink: #1e2a37;
      --muted: #5d6a79;
      --accent: #2457c5;
      --accent-soft: #eaf0ff;
      --correct: #1f8a4c;
      --incorrect: #b03a2e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Aptos", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eff3fb 0%, #f9fbff 100%);
      color: var(--ink);
    }

    main {
      max-width: 780px;
      margin: 48px auto;
      padding: 0 20px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(26, 48, 92, 0.08);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.15;
    }

    p {
      line-height: 1.6;
    }

    .meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin: 20px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .question {
      font-size: 22px;
      margin: 0 0 18px;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    button.choice {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    button.choice:hover {
      border-color: #a7bbec;
      background: #f7faff;
      transform: translateY(-1px);
    }

    button.choice[disabled] {
      cursor: default;
      transform: none;
    }

    button.choice.correct {
      border-color: #bde6ca;
      background: #eefaf2;
    }

    button.choice.incorrect {
      border-color: #f1c0bb;
      background: #fff3f1;
    }

    .feedback {
      min-height: 28px;
      margin-bottom: 16px;
      font-size: 15px;
      color: var(--muted);
    }

    .feedback.correct {
      color: var(--correct);
    }

    .feedback.incorrect {
      color: var(--incorrect);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .primary,
    .secondary {
      padding: 12px 18px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      border: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .summary-box {
      border: 1px solid var(--border);
      background: #fbfcff;
      border-radius: 16px;
      padding: 18px;
      margin: 18px 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <p class="eyebrow">Minimal Example</p>
      <h1>SCORM Quiz Starter</h1>
      <p>This is a small reference quiz that demonstrates one-question-at-a-time flow, immediate feedback, score reporting, and resume-friendly state handling.</p>
      <div id="app"></div>
    </section>
  </main>

  <script src="scormdriver.js"></script>
  <script>
    const questions = [
      {
        prompt: "Which planet is known as the Red Planet?",
        choices: ["Mars", "Venus", "Mercury", "Jupiter"],
        correctIndex: 0,
        explanation: "Mars is known as the Red Planet because iron oxide on its surface gives it a reddish appearance."
      },
      {
        prompt: "What does a bar chart help learners do most directly?",
        choices: ["Compare categories", "Read a narrative", "Simulate motion", "Store browser cookies"],
        correctIndex: 0,
        explanation: "Bar charts are especially useful when learners need to compare categories or groups quickly."
      },
      {
        prompt: "In a SCORM activity, what is suspend_data mainly used for?",
        choices: ["To store learner progress state", "To host image files", "To replace the manifest", "To render CSS"],
        correctIndex: 0,
        explanation: "suspend_data is commonly used to store the learner's resumable state between launches."
      }
    ];

    const passingScore = 70;
    const state = {
      currentIndex: 0,
      selectedChoice: null,
      answers: [],
      score: 0,
      completed: false
    };

    const app = document.getElementById("app");
    const scorm = window.scorm12;

    function init() {
      scorm.init();
      scorm.setStatus("incomplete");
      restoreState();
      render();
    }

    function restoreState() {
      const raw = scorm.getSuspendData();
      if (!raw) {
        return;
      }

      try {
        const saved = JSON.parse(raw);
        state.currentIndex = saved.currentIndex ?? 0;
        state.answers = Array.isArray(saved.answers) ? saved.answers : [];
        state.score = Number(saved.score ?? 0);
        state.completed = Boolean(saved.completed);
      } catch (error) {
        console.warn("Could not parse suspend_data", error);
      }
    }

    function persistState() {
      const payload = JSON.stringify({
        currentIndex: state.currentIndex,
        answers: state.answers,
        score: state.score,
        completed: state.completed
      });

      scorm.setSuspendData(payload);
      scorm.setLocation(state.completed ? "summary" : String(state.currentIndex));
      scorm.commit();
    }

    function getQuestionStatus(questionIndex) {
      return state.answers.find((entry) => entry.questionIndex === questionIndex) || null;
    }

    function answerQuestion(choiceIndex) {
      const question = questions[state.currentIndex];
      const existing = getQuestionStatus(state.currentIndex);
      if (existing) {
        return;
      }

      const isCorrect = choiceIndex === question.correctIndex;
      state.answers.push({
        questionIndex: state.currentIndex,
        choiceIndex,
        isCorrect
      });

      if (isCorrect) {
        state.score += Math.round(100 / questions.length);
      }

      persistState();
      render();
    }

    function moveNext() {
      if (state.currentIndex < questions.length - 1) {
        state.currentIndex += 1;
        persistState();
        render();
        return;
      }

      finishQuiz();
    }

    function finishQuiz() {
      state.completed = true;
      const finalScore = Math.min(state.score, 100);
      scorm.setScore(finalScore, 0, 100);
      scorm.setStatus(finalScore >= passingScore ? "passed" : "failed");
      scorm.setExit("suspend");
      persistState();
      render();
    }

    function restartQuiz() {
      state.currentIndex = 0;
      state.answers = [];
      state.score = 0;
      state.completed = false;
      scorm.setStatus("incomplete");
      persistState();
      render();
    }

    function render() {
      if (state.completed) {
        renderSummary();
        return;
      }

      const question = questions[state.currentIndex];
      const answered = getQuestionStatus(state.currentIndex);
      const progressLabel = `Question ${state.currentIndex + 1} of ${questions.length}`;

      app.innerHTML = `
        <div class="meta">
          <span>${progressLabel}</span>
          <span>Score: ${state.score}</span>
          <span>Passing score: ${passingScore}</span>
        </div>
        <h2 class="question">${question.prompt}</h2>
        <div class="choices"></div>
        <div id="feedback" class="feedback"></div>
        <div class="actions">
          <button id="nextButton" class="primary" ${answered ? "" : "disabled"}>${state.currentIndex === questions.length - 1 ? "Finish" : "Next question"}</button>
        </div>
      `;

      const choicesContainer = app.querySelector(".choices");
      question.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = choice;
        button.disabled = Boolean(answered);
        button.addEventListener("click", () => answerQuestion(index));

        if (answered) {
          if (index === question.correctIndex) {
            button.classList.add("correct");
          } else if (index === answered.choiceIndex) {
            button.classList.add("incorrect");
          }
        }

        choicesContainer.appendChild(button);
      });

      const feedback = document.getElementById("feedback");
      if (answered) {
        feedback.className = `feedback ${answered.isCorrect ? "correct" : "incorrect"}`;
        feedback.textContent = `${answered.isCorrect ? "Correct." : "Not quite."} ${question.explanation}`;
      }

      document.getElementById("nextButton").addEventListener("click", moveNext);
    }

    function renderSummary() {
      const finalScore = Math.min(state.score, 100);
      const outcome = finalScore >= passingScore ? "passed" : "not yet passed";

      app.innerHTML = `
        <div class="summary-box">
          <h2>Quiz complete</h2>
          <p>You scored <strong>${finalScore}</strong> out of 100 and ${outcome} this activity.</p>
          <p>Your answers were stored through SCORM state, so this summary can be restored on re-entry.</p>
        </div>
        <div class="actions">
          <button id="restartButton" class="secondary" type="button">Restart quiz</button>
        </div>
      `;

      document.getElementById("restartButton").addEventListener("click", restartQuiz);
    }

    window.addEventListener("beforeunload", () => {
      if (!state.completed) {
        scorm.setExit("suspend");
        persistState();
      }
      scorm.finish();
    });

    init();
  </script>
</body>
</html>
